<!doctype html><html lang="mn" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/components.css"><link rel="stylesheet" href="/screens.css"><body><main style="max-width:1100px;margin:auto;padding:24px"><p>LOCAL QA — туршилтын өгөгдөл</p><nav><button data-view="home">Нүүр</button><button data-view="membership">Эрх</button><button data-view="battle">Challenge</button></nav><div id="preview"></div></main><script type="module">
import {emptyState,ensureDay} from '/core.js';import {migrateAdvanced} from '/advanced-state.js';import {homeView} from '/home.js';import {translator} from '/i18n.js';import {baseWords} from '/words.js';import {saveLearningPlan} from '/learning-plan.js';import {MembershipUI} from '/membership-ui.js';import {BattleUI} from '/battle-ui.js';
const s=emptyState();migrateAdvanced(s);const t=translator('mn');const ctx={t,timeLabel:v=>new Date(v).toLocaleTimeString(),dateLabel:v=>new Date(v).toLocaleDateString(),countdown:()=>'',persist:()=>{},byId:id=>baseWords.find(w=>w.id===id),locale:'mn-MN'};let view='home';
const membership=new MembershipUI({state:()=>s,user:()=>({id:'preview'}),render});membership.status={active:true,gate_enabled:false,coins:1000,coin_price:100000,price:5000,streak:2,streak_days:7,discount_percent:0,unlimited:false,expires_at:'2026-12-18',sales_enabled:false};
const battle=new BattleUI({state:()=>s,user:()=>({id:'preview'}),deviceId:()=>'',render});battle.rows=[];battle.players=[{user_id:'preview',handle:'Бат',level:2},{user_id:'other',handle:'Найз',level:3}];
function render(){document.querySelector('#preview').innerHTML=view==='membership'?membership.view():view==='battle'?battle.view():homeView(s,ensureDay(s,baseWords),ctx);}render();
document.addEventListener('click',e=>{if(e.target.dataset.view){view=e.target.dataset.view;render();}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='learning-plan-form'){saveLearningPlan(s,Object.fromEntries(new FormData(e.target)),baseWords);render();}});
</script></body></html>
